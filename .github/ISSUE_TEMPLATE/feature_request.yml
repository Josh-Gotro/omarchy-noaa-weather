name: Feature request
description: Suggest something the plugin should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: this plugin is **United States only**,
        because `api.weather.gov` has no data elsewhere. Worldwide coverage is
        not a feature request, it is a new file in `providers/`. See
        "Adding another provider" in the README, and CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, rather than the solution you have in mind.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you would like it to do
